name: Prospecting qualification preview
on:
  workflow_dispatch:
  push:
    branches: [codex/prospecting-preview-v2]
    paths: [.github/workflows/prospecting-preview.yml]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_prospecting
      - name: Qualify without sending
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAPPERS_API_KEY: ${{ secrets.PAPPERS_API_KEY }}
        run: python prospecting_preview.py --max-pappers-calls 5 --lookback-days 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prospecting-preview
          path: |
            private/prospecting-preview/report.md
            private/prospecting-preview/report.json
            private/prospecting-preview/diagnostics.json
            private/prospecting-preview/sources.json
          retention-days: 3
